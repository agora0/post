  <div class="post-content e-content" itemprop="articleBody">
    <img src="https://www.inmediahk.net/files/column_images/1280%20%E7%9A%84%E5%89%AF%E6%9C%AC_1.png" /><div class="field field-name-body field-type-text-with-summary field-label-hidden"><div class="field-items"><div class="field-item even"><p><font color="red">（獨媒報導）</font>中大六間書院的學生會因不被校方承認，一個月內先後停運或解散。《獨媒》走訪多間書院學生會的會室，紀錄它們最後的時光。</p>
<p>伍宜孫書院學生會停運後，會室交還院方管理。學生會旗、印章等重要物品，目前暫存在前學生會成員手上。未被收回的屬會會室則仍留有學生會的痕跡，包括在修訂會章公投時用作紀錄票數的白板、票箱、學生會tee和迎新營刊物等。</p>
