  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">灾后访记：何以为“家”，故土破碎后，尼泊尔塔芒族人走与留的困局</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-11-02T06:58:00+08:00" itemprop="datePublished">Nov 2, 2026
      </time>• <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span class="p-author h-card" itemprop="name">端传媒编辑部</span></span></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>10 月初，尼泊尔中部城镇比德尔的一座寺院，空气中弥漫着燃烧的杜松（尼泊尔语称 <em>sang</em>）香的气味，风不断吹动寺外飘扬的经幡。一群妇女坐在外面，头发散落，一边哭泣，一边歌唱。有些孩子在玩耍，有些则躺在母亲的怀里。</p><p>寺内，僧人不停地诵念经文。一侧墙上排列着遇难者的照片。有的照片里是幼童，有的则是中老年人。 </p>
