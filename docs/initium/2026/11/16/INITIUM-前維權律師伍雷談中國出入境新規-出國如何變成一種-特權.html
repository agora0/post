  <div class="post-content e-content" itemprop="articleBody">
    <p>2026 年 7 月發布、9 月 15 日起正式施行的《<a href="https://www.gov.cn/zhengce/content/202607/content_7077172.htm?ref=theinitium.com" rel="noreferrer">國務院關於出境入境管理的規定</a>》，是中國出入境管理法 2013 年實施以來，國務院首次出臺針對出入境管理的專項行政法規（下稱「新規」）。其中規定的不準出境的若干情形，引發外界廣泛關注。</p>
