    <h1 class="post-title p-name" itemprop="name headline">從風靡到抵制，「虐待娜塔莎」背後被否認的種族歧視</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-07-16T07:00:50+08:00" itemprop="datePublished">Jul 16, 2026
      </time>• <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span class="p-author h-card" itemprop="name">端傳媒編輯部</span></span></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p>今年4月，一款名為「娜塔莎」的黑人嬰兒形象玩偶，以一種獵奇的方式在中國社交平台走紅。</p><p>熱門影片里，「娜塔莎」遭到摔打、踩踏、捅刺等花樣百出的破壞性對待。有人往它的體內注水或充氣直至撐爆，也有人划破它的肚皮剖出藏好的小玩偶，配文：娜塔莎生孩子啦。這場熱潮引來了中小學生的跟風模仿，也讓這款市價低廉、製作粗糙的小商品一度供不應求。</p>
