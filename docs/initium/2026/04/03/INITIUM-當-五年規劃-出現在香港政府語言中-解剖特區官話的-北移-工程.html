  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">當「五年規劃」出現在香港政府語言中：解剖特區官話的「北移」工程</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-04-03T07:00:21+08:00" itemprop="datePublished">Apr 3, 2026
      </time>• <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span class="p-author h-card" itemprop="name">夏念梓</span></span></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <h2 id="%E4%B8%BB%E9%AB%94%E6%80%A7%E7%9A%84%E7%84%A1%E8%81%B2%E6%9B%BF%E6%8F%9B">主體性的無聲替換</h2><p>2026年2月4日，農曆新年前夕，香港行政長官李家超在中聯辦新春團拜會上突然<a href="http://www.locpg.gov.cn/20260204/9755356cac6d48de9b702cc5d7a947c0/c.html?ref=theinitium.com"><u>宣布</u></a>，特區政府將「首次制定五年規劃」。隨後兩會期間，消息迅速在中央層級被<a href="https://www.info.gov.hk/gia/general/202603/05/P2026030500324.htm?ref=theinitium.com"><u>定調</u></a>：香港首份「五年規劃」將「主動對接」國家「十五五」藍圖，具備「宏觀性、戰略性和前瞻性」。3月，<a href="https://news.rthk.hk/rthk/ch/component/k2/1847059-20260312.htm?ref=theinitium.com"><u>「香港五年規劃編制小組」</u></a>在特區設立，預計年內可完成工作。</p>
