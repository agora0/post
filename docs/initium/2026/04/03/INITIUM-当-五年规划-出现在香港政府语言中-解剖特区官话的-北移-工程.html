    <h1 class="post-title p-name" itemprop="name headline">当“五年规划”出现在香港政府语言中：解剖特区官话的“北移”工程</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-04-03T07:00:04+08:00" itemprop="datePublished">Apr 3, 2026
      </time>• <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span class="p-author h-card" itemprop="name">夏念梓</span></span></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <h2 id="%E4%B8%BB%E4%BD%93%E6%80%A7%E7%9A%84%E6%97%A0%E5%A3%B0%E6%9B%BF%E6%8D%A2">主体性的无声替换</h2><p>2026年2月4日，农历新年前夕，香港行政长官李家超在中联办新春团拜会上突然<a href="http://www.locpg.gov.cn/20260204/9755356cac6d48de9b702cc5d7a947c0/c.html?ref=theinitium.com" rel="noreferrer">宣布</a>，特区政府将“首次制定五年规划”。随后两会期间，消息迅速在中央层级被<a href="https://www.info.gov.hk/gia/general/202603/05/P2026030500324.htm?ref=theinitium.com" rel="noreferrer">定调</a>：香港首份“五年规划”将“主动对接”国家“十五五”蓝图，具备“宏观性、战略性和前瞻性”。3月，<a href="https://news.rthk.hk/rthk/ch/component/k2/1847059-20260312.htm?ref=theinitium.com" rel="noreferrer">“香港五年规划编制小组”</a>在特区设立，预计年内可完成工作。</p>
