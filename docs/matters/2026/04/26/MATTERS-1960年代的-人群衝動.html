    <h1 class="post-title p-name" itemprop="name headline">1960年代的「人群衝動」</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="2026-04-26T03:20:01+08:00" itemprop="datePublished">Apr 26, 2026
      </time>• <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span class="p-author h-card" itemprop="name">門爺</span></span></p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    <p><br class="smart"></p><figure class="image"><img src="https://imagedelivery.net/kDRCweMmqLnTPNlbum-pYA/prod/embed/b1fa690a-4fe9-4904-ab63-364e95cc25fe.jpeg/public" referrerpolicy="no-referrer"><figcaption></figcaption></figure><p><br class="smart"></p><figure class="image"><img src="https://imagedelivery.net/kDRCweMmqLnTPNlbum-pYA/prod/embed/2089c452-5654-44e2-90b6-3bd2b7d382f9.jpeg/public" referrerpolicy="no-referrer"><figcaption></figcaption></figure><p><br class="smart"></p><figure class="image"><img src="https://imagedelivery.net/kDRCweMmqLnTPNlbum-pYA/prod/embed/5ab72466-f6d2-4f70-8694-3c5505b9bab8.jpeg/public" referrerpolicy="no-referrer"><figcaption></figcaption></figure><p><br class="smart"></p><p>1960年代的「人群衝動」是全球性的。</p><p>圖一是李振盛拍的黑龍江「五・一六」誓師大會；圖二是伍德斯托克音樂節現場；圖三是巴黎五月風暴的街頭行動。前者是政治神學的廣場，後兩者分別是反文化的曠野與反體制的街道。它們彼此敵對，口號不同，表情不同，通往的世界也不同。</p><p>同一個世界，不同的集體幻覺。</p><p>今日亦然。</p>
